<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" id="beast-body-svg" class="body-svg" role="img" aria-label="通用动物躯体图">
<!--
  ============================================================================
  通用动物（妖兽）躯体 SVG —— 四足侧视·狼虎型·低多边形硬边
  ============================================================================
  设计口径（与 仙侠.html 内嵌的「通用人类躯体 SVG v15」同族）：
    · 画法同族：轮廓一律直线段（和 v15 那张「像素边精确描摹」的木人桩一样），
      不用曲线糊圆角——曲线会把兽形捏成卡通贴纸，硬边才有解剖感
    · 比例：头长 ≈ 身长 1/2 但压扁成楔形长吻（高仅长的 0.65），颈短厚，
      躯干纵深 ≈ 立腿长，四肢细于躯干（虎狼体态，不做成犬獒那种柱腿）
    · 配色：底色 #0f1724 + 柔光 bgGlow，部件本体 #22c55e，描边 #31415a / 外轮廓 #3b4b64
    · 画布 viewBox 0 0 200 160（四足侧视是横长身，套人形的 200×420 竖版会空掉六成画面；
      面板按 .body-svg{width:100%;max-width:220px;height:auto} 自适应比例，换盒子不影响嵌入）
    · 命名规则：L = 近侧（靠观者，画在前），R = 远侧（背观者，画在后）
    · 侧视只有一只可见眼，眼件用单节点 body-eyes（人形图的 eyes-left/right 为可选附加）
    · 兽类新增两格：耳（ears）、尾（tail）
    · 伤害区（脑/胸腔/颈/兽核）沿用人形图做法：整块剪影打底 + 分区件上色
  ···········································································
  24 部件清单（id 取「兽类名」，data-part 记「人形别名」）
    beast id      标签                人形别名      备注
    brain         脑（要害）          brain         同名
    eyes          眼                 eyes          同名，侧视单眼
    jaw           颚（利齿）          jaw           同名
    head          头                 head          同名
    ears          耳                 ——            兽类新增
    neck          颈（要害）          neck          同名
    chest         胸腔（要害）        chest         同名
    abdomen       腹                 abdomen       同名
    waist         腰                 waist         同名
    pelvis        盆（后胯）          pelvis        同名
    core          兽核（要害）        dantian       ★双 ID：<g id="body-dantian"> 包 <path id="body-core">
    tail          尾                 ——            兽类新增
    shoulderL/R   前肩（左近/右远）  upperArmL/R   ★双 ID
    forelegL/R    前腿（左近/右远）  forearmL/R    ★双 ID
    forePawL/R    前爪（左近/右远）  handL/R       ★双 ID
    thighL/R      后腿·股            thighL/R      同名
    shinL/R       后腿·胫            calfL/R       ★双 ID
    hindPawL/R    后爪（左近/右远）  footL/R       ★双 ID
  ···········································································
  ★双 ID 怎么做的（纯 SVG，不写 JS）：
    每个部位外层套 <g id="body-<人形别名>">，内层 <path id="body-<兽类名>" fill="inherit" stroke="inherit">。
    默认填色/描边给外层 g，内层用 fill="inherit" 继承 →
    _paintSvgPart() 无论命中兽类 id 还是人形别名 id，涂色都落在同一块图形上，两套接法都能上色。
  ···········································································
  接进游戏（两种任选，都不用改 _paintBattleSvgParts）：
    ① 兽类接法：新增 const BEAST_PARTS，id 用上面「beast id」列（24 格，含耳/尾）。
    ② 人形接法：直接把本文件当敌人躯体图用，仍按现有人形 22 格查 id，★双 ID 那 11 格由 <g> 兜住。
    ③ 换槽位改前缀：战斗槽把 id 前缀 body- 批量换成 battle-/enemy-，url(#beast-*) 引用同步替换
       （现有克隆函数已按 battle 前缀做这件事）。
-->
<defs>
    <radialGradient id="beast-bgGlow" cx="50%" cy="45%" r="55%">
        <stop offset="0%" stop-color="#2d4a3d" stop-opacity="0.3"></stop>
        <stop offset="100%" stop-color="transparent"></stop>
    </radialGradient>
    <clipPath id="beast-clipHead">
        <path d="M6,56 L14,49 L24,44 L34,41 L44,40 L52,44 L55,53 L52,62 L44,68 L30,72 L16,71 L8,66 Z"></path>
    </clipPath>
    <clipPath id="beast-clipTorso">
        <path d="M80,48 L112,49 L142,55 L162,62 L172,72 L175,84 L171,93 L160,98 L140,100 L116,100 L97,97 L86,92 L79,80 L78,64 Z"></path>
    </clipPath>
</defs>

<!-- 背景 -->
<rect width="200" height="160" fill="#0f1724" rx="10"></rect>
<rect width="200" height="160" fill="url(#beast-bgGlow)" rx="10"></rect>
<ellipse cx="100" cy="152" rx="84" ry="4.5" fill="#0b1220" opacity="0.5"></ellipse>

