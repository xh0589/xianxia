<!-- ===== 躯干分区（前后竖切线 + 腰腹横切线，与人形图同一套分割法） ===== -->
<path class="part" id="body-chest" data-part="chest" d="M80,48 L112,49 L116,100 L97,97 L86,92 L79,80 L78,64 Z" fill="#22c55e" stroke="#31415a" stroke-width="1.1"><title>胸腔（要害）</title></path>
